<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinylDeck Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .window-frame {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 20px;
      width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-info {
      text-align: center;
      margin-bottom: 12px;
    }
    .now { font-size: 10px; color: #888; letter-spacing: 1px; }
    .album { font-size: 14px; font-weight: bold; color: #4caf50; margin-top: 2px; }
    .filters-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 15px;
    }
    .filters-box select {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      padding: 6px;
      font-size: 11px;
      border-radius: 4px;
      outline: none;
    }
    .cover-box {
      width: 100%;
      height: 180px;
      background: #111;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      border: 1px solid #333;
      overflow: hidden;
    }
    .main-cover { max-width: 100%; max-height: 100%; object-fit: cover; }
    .track-meta { text-align: center; margin-bottom: 15px; }
    .track-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .track-artist { font-size: 13px; color: #aaa; }
    .progress-wrap { margin-bottom: 15px; }
    .progress-bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.1s linear; }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #777;
      margin-top: 4px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .ctrl-btn, .zip-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .ctrl-btn:hover, .zip-btn:hover { background: #444; }
    .play-btn { background: #4caf50; color: #000; }
    .play-btn:hover { background: #45a049; }
    .zip-btn { background: #2196f3; }
    .zip-btn:hover { background: #1e88e5; }
    .track-counter { text-align: center; font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <div class="window-frame">
    <div class="player-side" id="player-side">
      <div class="top-info">
        <div class="now">NOW PLAYING</div>
        <div class="album" id="album-tag">Аудиоколлекция</div>
      </div>

      <div class="filters-box">
        <select id="filter-artist" onchange="applyFilters()"><option value="">Все исполнители</option></select>
        <select id="filter-year" onchange="applyFilters()"><option value="">Все года</option></select>
        <select id="filter-album" onchange="applyFilters()"><option value="">Все альбомы</option></select>
        <select id="filter-genre" onchange="applyFilters()"><option value="">Все жанры</option></select>
      </div>

      <div class="cover-box">
        <img id="main-cover" class="main-cover" src="" alt="">
      </div>

      <div class="track-meta">
        <div class="track-title" id="track-title">Выберите ZIP-архив</div>
        <div class="track-artist" id="track-artist">Исполнитель</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-labels">
          <span id="cur-time">00:00</span>
          <span id="dur-time">00:00</span>
        </div>
      </div>

      <div class="controls">
        <label class="zip-btn" for="zip-input">ZIP</label>
        <input type="file" id="zip-input" accept=".zip" style="display: none;">
        
        <button class="ctrl-btn" onclick="prevTrack()">PREV</button>
        <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()">PLAY</button>
        <button class="ctrl-btn" onclick="nextTrack()">NEXT</button>
      </div>

      <div class="track-counter" id="track-counter">Песня 0 из 0</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
